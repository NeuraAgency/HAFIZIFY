services:
  hafizify-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hafizify-server
    ports:
      - "8000:8000"
    environment:
      # From the real .env.example -- GROQ_API_KEY required for Combined Mode
      # (groq_transcriber.py). HF_TOKEN optional but avoids rate-limiting on
      # the "check for updates" metadata calls hybrid_diacritic_pipeline.py
      # makes on startup when fetching whisper-l-v3-turbo-quran-lora-dataset-mix.
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env
    volumes:
      # Mount the big model dir instead of baking it into the image for
      # faster rebuilds during development. Switch to COPY in the Dockerfile
      # for a single self-contained deploy image later.
      - ./whisper-l-v3-turbo-quran-lora-dataset-mix:/app/whisper-l-v3-turbo-quran-lora-dataset-mix:ro
      # Persist the HF Hub cache (2026-08-04, Claude/chat) -- without this,
      # the container filesystem is thrown away on every restart/recreate,
      # so "[Combined Mode] Not found in local HF cache ... downloading from
      # HuggingFace Hub" was firing on EVERY docker compose up, re-pulling
      # the whole MaddoggProduction/whisper-l-v3-turbo-quran-lora-dataset-mix
      # repo from HF each time (harmless, just slow -- it does still load
      # fine after downloading). This named volume makes that download
      # happen once, ever.
      - hf_cache:/root/.cache/huggingface
    # GPU passthrough for AMD/ROCm (2026-08-05, Claude/chat) -- swapped from
    # the NVIDIA `deploy.resources.reservations` block. ROCm doesn't use
    # Docker's device-reservation/driver-capabilities mechanism at all;
    # instead the container needs direct access to the host's DRM/KFD
    # device nodes plus membership in the host's `video` group. Requires
    # the ROCm kernel driver (amdgpu) already installed on the HOST, not
    # just inside the container -- confirm with `rocm-smi` on the host
    # first. `video` (and on some distros `render`) must be added via
    # `group_add` or the container can open the device nodes but still get
    # permission-denied talking to them.
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    # Docker's default /dev/shm is 64MB -- too small for PyTorch/ROCm's
    # shared-memory IPC under real model load (torch's DataLoader workers
    # and some ROCm collective ops use it), and failures here show up as
    # confusing crashes unrelated to the actual code. 16g is generous
    # headroom given the MI300X host has 240GB system RAM to spare.
    shm_size: '16gb'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s   # give the turbo model time to load on cold start

volumes:
  hf_cache:
